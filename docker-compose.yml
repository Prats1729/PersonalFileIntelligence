version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: pfi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: pfi_user
      POSTGRES_PASSWORD: pfi_secure_password
      POSTGRES_DB: personal_file_intelligence
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pfi_user -d personal_file_intelligence"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: pfi-server
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      CLIENT_URL: http://localhost:80
      DATABASE_URL: postgresql://pfi_user:pfi_secure_password@postgres:5432/personal_file_intelligence
      JWT_SECRET: replace_with_minimum_32_char_secret_key_prod
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:5000/api/auth/google/callback}
      TRUST_PROXY: "1"
      ENCRYPTION_MASTER_KEY: ${ENCRYPTION_MASTER_KEY:-dev_default_master_encryption_key_32chars!}
      DAILY_FREE_AI_QUOTA: 30
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:5000
    container_name: pfi-client
    restart: unless-stopped
    ports:
      - "80:8080"
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
